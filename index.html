<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR SECRETS LAB: 오개념 정복 완성본</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #f1f5f9; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-active { background: #38bdf8; color: #0f172a; font-weight: bold; transform: scale(1.05); }
        
        input[type=range] { -webkit-appearance: none; width: 100%; height: 10px; border-radius: 10px; outline: none; background: #1e293b; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #fff; border: 4px solid #38bdf8; border-radius: 50%; }
        
        .temp-gradient { background: linear-gradient(to right, #ff4d4d, #ffa347, #fff48a, #ffffff, #99bbff, #4d88ff) !important; }
        .star-glow { transition: all 0.3s ease; border-radius: 50%; }
        
        /* 등급 실험 밝기 박스 */
        .brightness-box {
            background: radial-gradient(circle at center, #111827 0%, #000000 100%);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 1.5rem;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 180px; margin-top: 1.5rem; overflow: hidden;
        }
        #lab3-observer-star { width: 8px; height: 8px; background: white; border-radius: 50%; transition: all 0.2s ease-out; }

        /* FAQ 스타일 */
        .faq-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; padding: 1.25rem; transition: all 0.3s; }
        .faq-q { color: #38bdf8; font-weight: 800; margin-bottom: 0.5rem; display: flex; align-items: start; }
        .faq-a { color: #cbd5e1; font-size: 0.875rem; line-height: 1.6; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="p-6 max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
        <div class="text-center lg:text-left">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-emerald-400 to-red-400 uppercase italic">Star Secrets Lab</h1>
            <p class="text-slate-400 text-sm font-medium">별의 특성 통합 사고 실험실</p>
        </div>
        <nav class="flex space-x-2 glass p-1 rounded-2xl">
            <button onclick="App.switchTab('temp')" id="btn-temp" class="tab-active px-6 py-2 rounded-xl text-xs transition">1. 온도와 색깔</button>
            <button onclick="App.switchTab('parallax')" id="btn-parallax" class="px-6 py-2 rounded-xl text-xs transition text-slate-400">2. 연주시차와 거리</button>
            <button onclick="App.switchTab('magnitude')" id="btn-magnitude" class="px-6 py-2 rounded-xl text-xs transition text-slate-400">3. 별의 등급(10pc)</button>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4">

        <!-- 🧪 실험 1: 별의 온도와 색깔 -->
        <section id="view-temp" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-[2rem] space-y-8">
                <h2 class="text-xl font-bold text-red-400 flex items-center gap-2"><i class="fas fa-temperature-high"></i> 별의 온도와 색깔</h2>
                <div class="space-y-6">
                    <div class="flex justify-between items-end font-mono"><span class="text-slate-500 text-xs">Surface Temperature</span><span id="lab1-t-val" class="text-5xl font-black italic">6,000 K</span></div>
                    <input type="range" id="lab1-t-slider" min="3000" max="30000" step="100" value="6000" class="temp-gradient">
                </div>
                <div id="lab1-star-list" class="flex flex-wrap gap-2 pt-4 border-t border-white/5"></div>
            </div>
            <div class="glass rounded-[2rem] flex flex-col items-center justify-center p-10 min-h-[450px] bg-slate-950">
                <div id="lab1-star-visual" class="star-glow w-44 h-44 bg-white mb-10 shadow-[0_0_80px_rgba(255,255,255,0.4)]"></div>
                <div class="text-center"><p id="lab1-spectral" class="text-blue-400 font-black tracking-widest text-sm mb-1 uppercase">Spectral Type G</p><p id="lab1-color-name" class="text-4xl font-black text-white">황색 별</p></div>
            </div>
        </section>

        <!-- 🧪 실험 2: 연주시차와 거리 -->
        <section id="view-parallax" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-[2rem] space-y-6">
                <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2"><i class="fas fa-sync-alt"></i> 연주시차와 거리 관계</h2>
                <div class="space-y-6">
                    <div class="flex justify-between font-mono items-end"><span class="text-slate-500 text-xs uppercase">Distance (d)</span><span id="lab2-d-val" class="text-emerald-400 font-black text-3xl italic">1.30 pc</span></div>
                    <input type="range" id="lab2-d-slider" min="1" max="10" step="0.1" value="1.3">
                    <div class="bg-black/40 p-6 rounded-2xl border border-emerald-500/20 text-center">
                        <p class="text-[10px] text-emerald-500 font-black mb-1 uppercase">연주시차(p") = 1 / 거리(d)</p>
                        <p id="lab2-p-calc" class="text-5xl font-black italic text-white italic tracking-tighter">0.77"</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 pt-4 border-t border-white/5">
                    <p class="w-full text-[10px] font-bold text-slate-500 uppercase mb-1">실제 별 선택</p>
                    <button onclick="Lab2.setStar(1.3, '프록시마')" class="px-3 py-2 bg-slate-800 rounded-xl text-xs font-bold hover:bg-emerald-600 transition">프록시마(1.3pc)</button>
                    <button onclick="Lab2.setStar(2.6, '시리우스')" class="px-3 py-2 bg-slate-800 rounded-xl text-xs font-bold hover:bg-emerald-600 transition">시리우스(2.6pc)</button>
                    <button onclick="Lab2.setStar(7.7, '베가')" class="px-3 py-2 bg-slate-800 rounded-xl text-xs font-bold hover:bg-emerald-600 transition">베가(7.7pc)</button>
                </div>
            </div>
            <div class="glass rounded-[2rem] min-h-[450px] relative overflow-hidden bg-slate-950">
                <svg id="lab2-svg" viewBox="0 0 600 400">
                    <circle cx="80" cy="200" r="22" fill="url(#lab2-sun-grad)" />
                    <defs><radialGradient id="lab2-sun-grad"><stop offset="0%" stop-color="#fff7ed"/><stop offset="60%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#ea580c"/></radialGradient></defs>
                    <ellipse cx="80" cy="200" rx="40" ry="100" fill="none" stroke="white" stroke-opacity="0.1" stroke-dasharray="3" />
                    <g id="lab2-earth-a" opacity="0.4"><circle cx="80" cy="100" r="7" fill="#3b82f6" stroke="white"/><text x="58" y="105" fill="white" font-size="10" font-weight="bold">A</text></g>
                    <g id="lab2-earth-b" opacity="0.4"><circle cx="80" cy="300" r="7" fill="#3b82f6" stroke="white"/><text x="58" y="305" fill="white" font-size="10" font-weight="bold">B</text></g>
                    <line id="lab2-line-a" stroke="white" stroke-opacity="0.1" stroke-dasharray="4" />
                    <line id="lab2-line-b" stroke="white" stroke-opacity="0.1" stroke-dasharray="4" />
                    <circle id="lab2-point-a" r="5" fill="#fde047" opacity="0.3" />
                    <circle id="lab2-point-b" r="5" fill="#fde047" opacity="0.3" />
                    <line id="lab2-line-live" x1="80" y1="200" x2="550" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2" />
                    <circle id="lab2-earth-live" r="9" fill="#3b82f6" stroke="white" stroke-width="1.5" />
                    <circle id="lab2-point-live" r="7" fill="#fde047" filter="blur(2px)" />
                    <circle id="lab2-star" r="10" fill="#fde047" />
                    <text id="lab2-star-label" y="25" fill="white" font-size="11" font-weight="black" text-anchor="middle">별 S</text>
                </svg>
            </div>
        </section>

        <!-- 🧪 실험 3: 별의 등급 -->
        <section id="view-magnitude" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-[2rem] space-y-6">
                <h2 class="text-xl font-bold text-yellow-400 flex items-center gap-2"><i class="fas fa-eye"></i> 별의 거리와 등급</h2>
                <div class="space-y-4">
                    <div class="flex justify-between font-mono items-end"><span class="text-slate-500 text-xs">Distance (d)</span><span id="lab3-d-val" class="text-yellow-400 font-black text-3xl italic">10.0 pc</span></div>
                    <input type="range" id="lab3-d-slider" min="1" max="100" step="1" value="10">
                </div>
                <div class="bg-black/40 rounded-2xl overflow-hidden border border-white/10 font-bold">
                    <table class="w-full text-sm">
                        <tr class="bg-white/5 border-b border-white/5"><td class="p-4 text-slate-400 italic">절대 등급 (M)</td><td class="p-4 text-right text-blue-400 font-black text-xl tracking-tighter">4.80</td></tr>
                        <tr class="border-b border-white/5"><td class="p-4 text-slate-400 italic">겉보기 등급 (m)</td><td id="lab3-m-val" class="p-4 text-right text-yellow-400 font-black text-xl italic tracking-tighter">4.80</td></tr>
                        <tr class="bg-white/5"><td class="p-4 text-white text-lg italic uppercase">등급 차 (m - M)</td><td id="lab3-diff-val" class="p-4 text-right text-white text-3xl tracking-tighter">0.00</td></tr>
                    </table>
                </div>
                <div class="brightness-box shadow-inner">
                    <p class="absolute top-3 left-4 text-[10px] font-bold text-blue-400 uppercase tracking-widest"><i class="fas fa-eye mr-1"></i> 지구 관측자 시점</p>
                    <div id="lab3-observer-star"></div>
                    <p id="lab3-observer-text" class="mt-8 text-xs font-bold text-slate-400 uppercase tracking-widest italic animate-pulse">기준 밝기 (M)</p>
                </div>
            </div>
            <div class="glass rounded-[2rem] min-h-[450px] relative overflow-hidden bg-slate-950 flex flex-col items-center">
                <svg id="lab3-svg" viewBox="0 0 400 400">
                    <path d="M 50 250 A 150 150 0 0 1 350 250" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="10" opacity="0.6" />
                    <text x="200" y="85" fill="#fde047" font-size="11" font-weight="black" text-anchor="middle">기준 거리 10 pc (M 지점)</text>
                    <g transform="translate(200, 250)"><circle r="18" fill="#3b82f6" stroke="white" stroke-width="1.5"/><text y="40" fill="#60a5fa" font-size="14" font-weight="black" text-anchor="middle">지구</text></g>
                    <circle cx="200" cy="100" r="10" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="2" />
                    <g id="lab3-star-group"><circle id="lab3-star-body" r="12" fill="#fff" /><text y="-25" fill="white" font-size="12" font-weight="black" text-anchor="middle" font-style="italic">가상의 별 (m)</text></g>
                </svg>
                <div id="lab3-conclusion" class="absolute bottom-6 left-6 right-6 p-4 rounded-xl text-center font-black text-sm"></div>
            </div>
        </section>

        <!-- 💡 [신설] 실험별 오개념 FAQ (선생님 요청사항) -->
        <div id="faq-section" class="mt-12 space-y-6">
            <h3 class="text-2xl font-black flex items-center gap-3 px-2">
                <span class="w-10 h-10 bg-yellow-500 text-black rounded-full flex items-center justify-center text-sm">!</span>
                잠깐! 헷갈리기 쉬운 별의 비밀 (오개념 FAQ)
            </h3>
            <div id="faq-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 animate-in fade-in slide-in-from-bottom-4 duration-700">
                <!-- 탭에 따라 내용이 자동으로 채워짐 -->
            </div>
        </div>

    </main>

    <script>
        const Lab1 = {
            data: [
                { min: 25000, max: 30000, color: '청색', spectral: 'O', hex: '#4d88ff', names: ['나오스'] },
                { min: 11000, max: 25000, color: '청백색', spectral: 'B', hex: '#99bbff', names: ['리겔', '스피카'] },
                { min: 7500, max: 11000, color: '백색', spectral: 'A', hex: '#ffffff', names: ['시리우스', '베가'] },
                { min: 6100, max: 7500, color: '황백색', spectral: 'F', hex: '#f5f5ff', names: ['카노푸스', '프로키온'] },
                { min: 5000, max: 6100, color: '황색', spectral: 'G', hex: '#fff48a', names: ['태양', '카펠라'] },
                { min: 3500, max: 5000, color: '주황색', spectral: 'K', hex: '#ffa347', names: ['아르크투루스', '알데바란'] },
                { min: 3000, max: 3500, color: '적색', spectral: 'M', hex: '#ff4d4d', names: ['베텔게우스', '안타레스'] }
            ],
            faqs: [
                { q: "붉은색 별은 뜨겁고, 푸른색 별은 차갑지 않나요?", a: "반대입니다! 가스레인지 불꽃이나 대장간의 쇳물을 생각해보세요. 온도가 낮을수록 붉은색을 띠고, 온도가 높아질수록 푸른색을 띱니다. 별의 온도와 색깔은 '빈의 변위 법칙'을 따릅니다." },
                { q: "별의 색깔이 별의 크기를 결정하나요?", a: "아닙니다. 색깔은 오직 별의 '표면 온도' 정보만 알려줍니다. 같은 노란색 별이라도 태양처럼 작은 주계열성일 수도 있고, 아주 거대한 거성일 수도 있습니다." }
            ],
            init() { document.getElementById('lab1-t-slider').oninput = () => this.update(); this.update(); },
            update() {
                const T = parseInt(document.getElementById('lab1-t-slider').value);
                const info = this.data.find(s => T >= s.min && T <= s.max) || this.data[0];
                document.getElementById('lab1-t-val').innerText = T.toLocaleString() + ' K';
                document.getElementById('lab1-t-val').style.color = info.hex;
                document.getElementById('lab1-spectral').innerText = 'Spectral Type ' + info.spectral;
                document.getElementById('lab1-color-name').innerText = info.color + ' 별';
                document.getElementById('lab1-color-name').style.color = info.hex;
                const star = document.getElementById('lab1-star-visual');
                star.style.backgroundColor = info.hex;
                star.style.boxShadow = `0 0 60px ${info.hex}aa, 0 0 120px ${info.hex}44`;
                document.getElementById('lab1-star-list').innerHTML = info.names.map(n => `<span class="px-4 py-2 bg-white/5 border border-white/10 rounded-xl text-xs font-bold tracking-tighter"><i class="fas fa-star mr-2" style="color:${info.hex}"></i>${n}</span>`).join('');
            }
        };

        const Lab2 = {
            angle: 0,
            faqs: [
                { q: "연주시차는 별이 실제로 우주에서 움직이는 각도인가요?", a: "아닙니다! 별은 가만히 있는데, 지구가 태양 주위를 공전하기 때문에 생기는 '겉보기 움직임'입니다. 관측자의 위치가 바뀌어서 생기는 현상일 뿐입니다." },
                { q: "모든 별의 연주시차를 측정할 수 있나요?", a: "이론적으로는 그렇지만, 너무 멀리 있는 별은 시차가 너무 작아서 지구에서는 측정하기 매우 어렵습니다. 그래서 시차가 측정되는 별은 상대적으로 우리와 가까운 별들입니다." }
            ],
            init() { document.getElementById('lab2-d-slider').oninput = () => this.updateUI(); this.updateUI(); this.animate(); },
            setStar(d, name) { document.getElementById('lab2-d-slider').value = d; document.getElementById('lab2-star-label').innerText = name; this.updateUI(); },
            updateUI() {
                const d = parseFloat(document.getElementById('lab2-d-slider').value);
                document.getElementById('lab2-d-val').innerText = d.toFixed(2) + ' pc';
                document.getElementById('lab2-p-calc').innerText = (1/d).toFixed(2) + '"';
                const sx = 80 + d * 45, sy = 200, bx = 550;
                const byA = 100 + (sy - 100) * (bx - 80) / (sx - 80), byB = 300 + (sy - 300) * (bx - 80) / (sx - 80);
                document.getElementById('lab2-star').setAttribute('cx', sx); document.getElementById('lab2-star').setAttribute('cy', sy);
                document.getElementById('lab2-star-label').setAttribute('x', sx); document.getElementById('lab2-star-label').setAttribute('y', sy + 25);
                document.getElementById('lab2-line-a').setAttribute('x1', 80); document.getElementById('lab2-line-a').setAttribute('y1', 100);
                document.getElementById('lab2-line-a').setAttribute('x2', bx); document.getElementById('lab2-line-a').setAttribute('y2', byA);
                document.getElementById('lab2-line-b').setAttribute('x1', 80); document.getElementById('lab2-line-b').setAttribute('y1', 300);
                document.getElementById('lab2-line-b').setAttribute('x2', bx); document.getElementById('lab2-line-b').setAttribute('y2', byB);
                document.getElementById('lab2-point-a').setAttribute('cx', bx); document.getElementById('lab2-point-a').setAttribute('cy', byA);
                document.getElementById('lab2-point-b').setAttribute('cx', bx); document.getElementById('lab2-point-b').setAttribute('cy', byB);
            },
            animate() {
                this.angle += 0.015;
                const d = parseFloat(document.getElementById('lab2-d-slider').value);
                const ex = 80 + 40 * Math.cos(this.angle), ey = 200 + 100 * Math.sin(this.angle);
                const sx = 80 + d * 45, sy = 200, bx = 550;
                const byLive = ey + (sy - ey) * (bx - ex) / (sx - ex);
                document.getElementById('lab2-earth-live').setAttribute('cx', ex); document.getElementById('lab2-earth-live').setAttribute('cy', ey);
                document.getElementById('lab2-line-live').setAttribute('x1', ex); document.getElementById('lab2-line-live').setAttribute('y1', ey);
                document.getElementById('lab2-line-live').setAttribute('x2', bx); document.getElementById('lab2-line-live').setAttribute('y2', byLive);
                document.getElementById('lab2-point-live').setAttribute('cx', bx); document.getElementById('lab2-point-live').setAttribute('cy', byLive);
                document.getElementById('lab2-point-live').style.opacity = 0.5 + 0.3 * Math.sin(this.angle);
                requestAnimationFrame(() => this.animate());
            }
        };

        const Lab3 = {
            faqs: [
                { q: "숫자가 큰 별이 더 밝은 별 아닌가요?", a: "가장 흔한 실수입니다! 등급의 숫자가 작을수록(마이너스로 갈수록) 더 밝은 별입니다. 1등급 별은 6등급 별보다 약 100배 더 밝습니다." },
                { q: "별을 10pc 거리로 옮기면 겉보기 등급은 사라지나요?", a: "아니요, 10pc 지점에서의 '겉보기 등급' 자체가 곧 '절대 등급'으로 정의되는 것입니다. 모든 별을 같은 출발선(10pc)에 세우고 밝기를 재는 것이 절대 등급의 원리입니다." },
                { q: "m - M 값이 클수록 별은 우리에게 가까운 건가요?", a: "틀렸습니다! m - M 값이 클수록(양수일수록) 별은 10pc보다 훨씬 멀리 있다는 뜻입니다. 10pc보다 가까우면 이 값은 음수(-)가 됩니다." }
            ],
            init() { document.getElementById('lab3-d-slider').oninput = () => this.update(); this.update(); },
            update() {
                const d = parseInt(document.getElementById('lab3-d-slider').value);
                const M = 4.8;
                let m = (d === 10) ? M : M + 5 * Math.log10(d) - 5;
                document.getElementById('lab3-d-val').innerText = d.toFixed(1) + ' pc';
                document.getElementById('lab3-m-val').innerText = m.toFixed(2);
                document.getElementById('lab3-diff-val').innerText = (m-M >= 0 ? '+' : '') + (m-M).toFixed(2);
                document.getElementById('lab3-star-group').setAttribute('transform', `translate(200, ${Math.max(20, 250 - 15 * d)})`);
                const obsStar = document.getElementById('lab3-observer-star');
                const obsText = document.getElementById('lab3-observer-text');
                const ratio = 10 / d;
                const glow = Math.max(2, 50 * ratio);
                obsStar.style.transform = `scale(${Math.min(3, Math.max(0.3, ratio * 1.2))})`;
                obsStar.style.boxShadow = `0 0 ${glow}px ${glow/3}px white`;
                obsStar.style.opacity = Math.min(1, 0.2 + ratio);
                if (d < 10) obsText.innerText = "매우 밝음 (m < M)";
                else if (d > 30) obsText.innerText = "희미함 (m > M)";
                else if (d === 10) obsText.innerText = "기준 밝기 (m = M)";
                else obsText.innerText = "어두워짐 (m > M)";
                const conc = document.getElementById('lab3-conclusion');
                if (d < 10) { conc.innerHTML = "★ 10 pc보다 가까움 ★<br>겉보기 등급(m) < 절대 등급(M)"; conc.className = "absolute bottom-6 left-6 right-6 p-4 rounded-xl text-center font-black text-sm bg-blue-900/40 text-blue-300 border border-blue-500/30"; }
                else if (d > 10) { conc.innerHTML = "★ 10 pc보다 멀음 ★<br>겉보기 등급(m) > 절대 등급(M)"; conc.className = "absolute bottom-6 left-6 right-6 p-4 rounded-xl text-center font-black text-sm bg-red-900/40 text-red-300 border border-red-500/30"; }
                else { conc.innerHTML = "★ 기준 거리 10 pc 지점 (m = M) ★"; conc.className = "absolute bottom-6 left-6 right-6 p-4 rounded-xl text-center font-black text-sm bg-emerald-900/40 text-emerald-300 border border-emerald-500/30"; }
            }
        };

        const App = {
            init() { Lab1.init(); Lab2.init(); Lab3.init(); this.updateFAQ('temp'); },
            switchTab(id) {
                document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
                document.getElementById('view-' + id).classList.remove('hidden');
                document.querySelectorAll('nav button').forEach(b => { b.classList.remove('tab-active', 'text-white'); b.classList.add('text-slate-400'); });
                document.getElementById('btn-' + id).classList.add('tab-active', 'text-white');
                this.updateFAQ(id);
            },
            updateFAQ(id) {
                const faqs = (id === 'temp') ? Lab1.faqs : (id === 'parallax') ? Lab2.faqs : Lab3.faqs;
                const container = document.getElementById('faq-container');
                container.innerHTML = faqs.map(item => `
                    <div class="faq-item">
                        <p class="faq-q"><i class="fas fa-question-circle mr-2 mt-1"></i> ${item.q}</p>
                        <p class="faq-a">${item.a}</p>
                    </div>
                `).join('');
            }
        };
        App.init();
    </script>
</body>
</html>
