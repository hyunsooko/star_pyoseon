<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별의 비밀: 실시간 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #f1f5f9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        
        /* 별 애니메이션 */
        #star-visual { transition: background-color 0.2s, box-shadow 0.2s; border-radius: 50%; }
        
        /* 슬라이더 디자인 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 10px;
            outline: none;
            background: linear-gradient(to right, #ff4d4d, #ffa347, #fff48a, #ffffff, #99bbff, #4d88ff);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px; height: 28px;
            background: #fff;
            border: 4px solid #0f172a;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="p-6 max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-red-400">별의 비밀 사고 실험실</h1>
        <div class="flex space-x-2 glass p-1 rounded-xl">
            <button onclick="switchView('temp')" id="btn-temp" class="tab-active px-4 py-2 rounded-lg text-sm">1. 온도와 색</button>
            <button onclick="switchView('dist')" id="btn-dist" class="px-4 py-2 rounded-lg text-sm">2. 시차와 거리</button>
            <button onclick="switchView('mag')" id="btn-mag" class="px-4 py-2 rounded-lg text-sm">3. 밝기와 등급</button>
        </div>
        <button onclick="document.getElementById('modal').style.display='flex'" class="bg-slate-800 p-3 rounded-full"><i class="fas fa-cog text-yellow-400"></i></button>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        
        <!-- 실험 1: 온도와 색깔 -->
        <section id="view-temp" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-3xl space-y-8">
                <div>
                    <h2 class="text-xl font-bold text-blue-400 mb-2"><i class="fas fa-thermometer-high mr-2"></i> 온도에 따른 색깔 변화</h2>
                    <p class="text-sm text-slate-400 font-medium italic">"슬라이더를 움직여보세요! 별이 즉시 변합니다."</p>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span class="text-slate-500 font-bold text-xs uppercase tracking-widest">Temperature</span>
                        <span id="t-display" class="text-5xl font-black text-white italic">6,000 K</span>
                    </div>
                    <input type="range" id="t-slider" min="3000" max="30000" step="100" value="6000">
                    <div class="flex justify-between text-[10px] font-black text-slate-500 uppercase tracking-tighter">
                        <span>3,000K (적색)</span>
                        <span class="text-white">10,000K (백색)</span>
                        <span>30,000K (청색)</span>
                    </div>
                </div>

                <div class="bg-black/30 p-6 rounded-2xl border border-white/5">
                    <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase tracking-widest">현재 온도 영역의 대표 별</h3>
                    <div id="star-list" class="flex flex-wrap gap-2 text-sm font-bold">
                        <!-- JS에서 별 데이터가 들어갑니다 -->
                    </div>
                </div>
            </div>

            <div class="glass rounded-3xl flex flex-col items-center justify-center p-10 min-h-[450px] relative bg-[radial-gradient(circle_at_center,_#1e293b_0%,_#020617_100%)]">
                <div id="star-visual" class="w-48 h-48 bg-white mb-10 shadow-[0_0_80px_rgba(255,255,255,0.5)]"></div>
                <div class="text-center">
                    <p id="spectral-display" class="text-blue-400 font-black tracking-widest mb-2">TYPE G</p>
                    <p id="color-display" class="text-4xl font-black text-white">황색 별</p>
                </div>
            </div>
        </section>

        <!-- 실험 2, 3은 생략하거나 간소화 (온도 기능에 집중) -->
        <section id="view-dist" class="hidden glass p-10 rounded-3xl text-center">연주시차 실험실 준비 중...</section>
        <section id="view-mag" class="hidden glass p-10 rounded-3xl text-center">등급 실험실 준비 중...</section>

        <!-- AI 피드백 모듈 -->
        <div class="mt-8 glass p-6 rounded-3xl flex flex-col md:flex-row gap-4 items-center">
            <textarea id="ai-input" class="flex-1 bg-black/30 border border-white/10 rounded-2xl p-4 text-sm" placeholder="질문을 입력하세요. 예: 별이 청색일 때 온도는 왜 높나요?"></textarea>
            <button onclick="askAI()" class="bg-purple-600 px-8 py-4 rounded-2xl font-bold hover:bg-purple-500 transition shadow-lg">AI 분석 시작</button>
        </div>
        <div id="ai-output" class="hidden mt-4 p-6 bg-black/50 rounded-2xl text-sm leading-relaxed text-slate-300"></div>

    </main>

    <!-- 설정 모달 -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-6">
        <div class="bg-slate-900 p-8 rounded-3xl max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4">Gemini API Key</h2>
            <input type="password" id="api-key" class="w-full bg-slate-800 p-4 rounded-xl mb-4 text-white" placeholder="Key 입력">
            <button onclick="saveKey()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">저장 및 닫기</button>
        </div>
    </div>

    <script>
        // 데이터셋
        const starDB = [
            { min: 25000, max: 30000, color: '청색', spectral: 'O', hex: '#4d88ff', stars: ['나오스'] },
            { min: 11000, max: 25000, color: '청백색', spectral: 'B', hex: '#99bbff', stars: ['리겔', '스피카'] },
            { min: 7500, max: 11000, color: '백색', spectral: 'A', hex: '#ffffff', stars: ['시리우스', '베가'] },
            { min: 6100, max: 7500, color: '황백색', spectral: 'F', hex: '#f5f5ff', stars: ['카노푸스', '프로키온'] },
            { min: 5000, max: 6100, color: '황색', spectral: 'G', hex: '#fff48a', stars: ['태양', '카펠라'] },
            { min: 3500, max: 5000, color: '주황색', spectral: 'K', hex: '#ffa347', stars: ['아르크투루스', '알데바란'] },
            { min: 3000, max: 3500, color: '적색', spectral: 'M', hex: '#ff4d4d', stars: ['베텔게우스', '안타레스'] }
        ];

        const tSlider = document.getElementById('t-slider');
        const tDisplay = document.getElementById('t-display');
        const starVisual = document.getElementById('star-visual');
        const colorDisplay = document.getElementById('color-display');
        const spectralDisplay = document.getElementById('spectral-display');
        const starList = document.getElementById('star-list');

        // 온도 업데이트 함수 (매우 중요)
        function updateAll() {
            const temp = parseInt(tSlider.value);
            
            // 데이터 찾기
            const data = starDB.find(s => temp >= s.min && temp <= s.max) || starDB[0];
            
            // UI 업데이트
            tDisplay.innerText = temp.toLocaleString() + ' K';
            colorDisplay.innerText = data.color + ' 별';
            colorDisplay.style.color = data.hex;
            spectralDisplay.innerText = 'TYPE ' + data.spectral;
            
            // 별 시각화 효과
            starVisual.style.backgroundColor = data.hex;
            starVisual.style.boxShadow = `0 0 80px ${data.hex}aa, 0 0 150px ${data.hex}55`;
            
            // 별 목록 배지 생성
            starList.innerHTML = data.stars.map(name => `
                <span class="bg-white/10 px-4 py-2 rounded-xl border border-white/20 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full" style="background:${data.hex}"></span>${name}
                </span>
            `).join('');
        }

        // 슬라이더 이벤트 바인딩 (oninput 보다 addEventListener가 훨씬 확실함)
        tSlider.addEventListener('input', updateAll);

        // 탭 전환
        function switchView(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
            document.querySelectorAll('nav button, .glass button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + id).classList.add('tab-active');
        }

        // AI 기능
        async function askAI() {
            const key = localStorage.getItem('gemini_key');
            if(!key) { alert('설정에서 API Key를 먼저 저장해주세요.'); return; }
            const q = document.getElementById('ai-input').value;
            const output = document.getElementById('ai-output');
            if(!q) return;

            output.classList.remove('hidden');
            output.innerHTML = "천문학자가 데이터를 분석 중입니다...";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `현재 온도 ${tSlider.value}K 환경입니다. 질문: ${q}` }] }] })
                });
                const json = await res.json();
                output.innerHTML = json.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            } catch (e) {
                output.innerHTML = "오류가 발생했습니다. API 키를 확인하세요.";
            }
        }

        function saveKey() {
            localStorage.setItem('gemini_key', document.getElementById('api-key').value);
            document.getElementById('modal').style.display = 'none';
        }

        // 페이지 로드 시 초기 실행
        updateAll();
    </script>
</body>
</html>
