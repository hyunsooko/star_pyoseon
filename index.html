<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별의 비밀: 연주 시차 실험실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #f1f5f9; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        
        /* 시뮬레이션 캔버스 디자인 */
        .sim-container {
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 궤도 선 */
        .orbit-line {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: absolute;
        }

        /* 애니메이션 선 */
        .projection-line {
            transition: all 0.5s ease-out;
            stroke-dasharray: 4;
            stroke: rgba(255, 255, 255, 0.3);
        }

        input[type=range] { -webkit-appearance: none; background: #1e293b; height: 10px; border-radius: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #38bdf8; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="p-6 max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 italic">별의 비밀: 시차 실험실</h1>
        <div class="flex space-x-2 glass p-1 rounded-xl">
            <button onclick="location.reload()" class="px-4 py-2 rounded-lg text-sm bg-slate-800">1. 온도와 색(리셋)</button>
            <button class="tab-active px-4 py-2 rounded-lg text-sm">2. 연주 시차</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 왼쪽: 컨트롤 패널 -->
        <div class="lg:col-span-1 space-y-6">
            <div class="glass p-8 rounded-3xl space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                        <i class="fas fa-satellite-dish"></i> 거리 조절 실험
                    </h2>
                    <p class="text-xs text-slate-400 mt-2">별이 멀어질수록 연주 시차(각도)는 어떻게 변할까요?</p>
                </div>

                <!-- 거리 슬라이더 -->
                <div class="space-y-4">
                    <div class="flex justify-between font-mono">
                        <span class="text-slate-400 text-sm">별까지의 거리 (d)</span>
                        <span id="d-display" class="text-emerald-400 font-bold text-xl">1.30 pc</span>
                    </div>
                    <input type="range" id="d-slider" min="1" max="10" step="0.1" value="1.3" class="w-full">
                    <div class="flex justify-between text-[10px] text-slate-500 font-bold uppercase">
                        <span>가까움 (1pc)</span>
                        <span>멂 (10pc)</span>
                    </div>
                </div>

                <!-- 대표 별 선택 -->
                <div class="pt-4 border-t border-white/5 space-y-3">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">실제 별 선택하기</p>
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="setStar(1.3, '프록시마 센타우리')" class="text-left p-3 rounded-xl bg-slate-800/50 hover:bg-emerald-900/30 border border-white/5 transition flex justify-between items-center">
                            <span class="text-xs font-bold">프록시마 센타우리 (가장 가까움)</span>
                            <span class="text-emerald-400 font-mono text-xs">1.3pc</span>
                        </button>
                        <button onclick="setStar(2.6, '시리우스')" class="text-left p-3 rounded-xl bg-slate-800/50 hover:bg-emerald-900/30 border border-white/5 transition flex justify-between items-center">
                            <span class="text-xs font-bold">시리우스</span>
                            <span class="text-emerald-400 font-mono text-xs">2.6pc</span>
                        </button>
                        <button onclick="setStar(7.7, '베가 (직녀성)')" class="text-left p-3 rounded-xl bg-slate-800/50 hover:bg-emerald-900/30 border border-white/5 transition flex justify-between items-center">
                            <span class="text-xs font-bold">베가 (직녀성)</span>
                            <span class="text-emerald-400 font-mono text-xs">7.7pc</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 데이터 보드 -->
            <div class="glass p-6 rounded-3xl grid grid-cols-1 gap-4 border-emerald-500/20">
                <div class="p-4 bg-emerald-950/20 rounded-2xl border border-emerald-500/20 text-center">
                    <p class="text-[10px] text-emerald-500 font-black uppercase mb-1">계산된 연주 시차 (p)</p>
                    <p id="p-display" class="text-4xl font-black text-white italic">0.77"</p>
                    <p class="text-[10px] text-slate-500 mt-2 font-mono italic">공식: p = 1 / d</p>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 교과서 도식 기반 시뮬레이션 -->
        <div class="lg:col-span-2 sim-container min-h-[500px] flex items-center justify-center">
            
            <svg id="parallax-svg" viewBox="0 0 800 500" class="w-full h-full">
                <!-- 원거리 배경 별들 -->
                <g id="background-stars" opacity="0.5">
                    <circle cx="750" cy="50" r="1" fill="white" />
                    <circle cx="750" cy="150" r="1.5" fill="white" />
                    <circle cx="750" cy="250" r="1" fill="white" />
                    <circle cx="750" cy="350" r="1.5" fill="white" />
                    <circle cx="750" cy="450" r="1" fill="white" />
                </g>

                <!-- 중앙 태양 -->
                <circle cx="100" cy="250" r="15" fill="url(#sun-grad)" />
                <defs>
                    <radialGradient id="sun-grad">
                        <stop offset="0%" stop-color="#fbbf24" />
                        <stop offset="100%" stop-color="#ea580c" />
                    </radialGradient>
                </defs>
                <text x="85" y="285" fill="#f59e0b" font-size="12" font-weight="bold">태양</text>

                <!-- 지구 궤도 -->
                <ellipse cx="100" cy="250" rx="40" ry="100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4" />

                <!-- 지구 위치 A, B (6개월 간격) -->
                <g id="earth-group">
                    <circle id="earth-a" cx="100" cy="150" r="8" fill="#3b82f6" />
                    <text x="75" y="155" fill="white" font-size="12" font-weight="bold">A</text>
                    
                    <circle id="earth-b" cx="100" cy="350" r="8" fill="#3b82f6" />
                    <text x="75" y="355" fill="white" font-size="12" font-weight="bold">B</text>
                    
                    <text x="115" y="255" fill="#94a3b8" font-size="10">지구 공전 궤도</text>
                </g>

                <!-- 관측선 (A에서 별, B에서 별) -->
                <line id="line-a" x1="100" y1="150" x2="750" y2="250" class="projection-line" stroke-width="1" />
                <line id="line-b" x1="100" y1="350" x2="750" y2="250" class="projection-line" stroke-width="1" />
                
                <!-- 연주 시차 각도 표시 (중심선) -->
                <line x1="100" y1="250" x2="750" y2="250" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2" />

                <!-- 목표 별 S -->
                <g id="star-s-group">
                    <circle id="star-s" cx="300" cy="250" r="10" fill="#fde047" filter="url(#glow)" />
                    <text id="star-name" x="290" y="280" fill="white" font-size="12" font-weight="bold">별 S</text>
                    <defs>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                            <feMerge><feMergeNode in="coloredBlur" /><feMergeNode in="SourceGraphic" /></feMerge>
                        </filter>
                    </defs>
                </g>

                <!-- 배경에 맺히는 상 Sa, Sb -->
                <circle id="point-sa" cx="750" cy="400" r="6" fill="#fde047" opacity="0.6" />
                <text x="765" y="405" fill="#94a3b8" font-size="12">SA</text>

                <circle id="point-sb" cx="750" cy="100" r="6" fill="#fde047" opacity="0.6" />
                <text x="765" y="105" fill="#94a3b8" font-size="12">SB</text>
                
                <text x="730" y="30" fill="#64748b" font-size="10" font-weight="bold">먼 배경 별</text>
            </svg>

            <!-- 각도 라벨 (연주 시차 p) -->
            <div id="angle-label" class="absolute left-[160px] top-[230px] text-[10px] text-emerald-400 font-bold bg-slate-900/80 px-1 border border-emerald-500/30 rounded">
                연주 시차 (p)
            </div>
        </div>
    </main>

    <!-- AI 하단 안내 -->
    <div class="max-w-6xl mx-auto px-4 mt-4">
        <div class="glass p-6 rounded-3xl border-l-4 border-emerald-500 flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-emerald-500/20 flex items-center justify-center shrink-0">
                <i class="fas fa-lightbulb text-emerald-400"></i>
            </div>
            <p class="text-sm text-slate-300 leading-relaxed">
                <b>학습 포인트:</b> 지구가 A에서 B까지 이동하는 데는 <b>6개월</b>이 걸립니다. 이때 측정된 시차(SA와 SB 사이의 각도)의 <b>절반(1/2)</b>을 <b>연주 시차</b>라고 합니다. 
                슬라이더를 오른쪽으로 밀어 별을 멀리 보내보세요. 각도가 작아지는 것을 확인할 수 있습니다!
            </p>
        </div>
    </div>

    <script>
        const dSlider = document.getElementById('d-slider');
        const dDisplay = document.getElementById('d-display');
        const pDisplay = document.getElementById('p-display');
        const starS = document.getElementById('star-s');
        const starName = document.getElementById('star-name');
        const lineA = document.getElementById('line-a');
        const lineB = document.getElementById('line-b');
        const pointSa = document.getElementById('point-sa');
        const pointSb = document.getElementById('point-sb');

        function updateParallax() {
            const dist = parseFloat(dSlider.value); // 1.0 ~ 10.0 pc
            const p = (1 / dist).toFixed(2); // 연주시차 p = 1/d
            
            // 데이터 업데이트
            dDisplay.innerText = dist.toFixed(2) + ' pc';
            pDisplay.innerText = p + '"';

            // 시뮬레이션 좌표 업데이트 (SVG 내부 좌표 800x500 기준)
            // 태양 위치가 x=100, 별의 최소 거리(1pc)를 x=250, 최대 거리(10pc)를 x=700으로 매핑
            const starX = 100 + (dist * 60); 
            starS.setAttribute('cx', starX);
            starName.setAttribute('x', starX - 20);

            // 광선 추적 (지구 A, B에서 별 S를 지나 배경 750px 지점까지)
            // 직선 방정식: (y - y1) = ( (y2-y1)/(x2-x1) ) * (x - x1)
            // x1, y1 = 지구 좌표 (100, 150/350)
            // x2, y2 = 별 좌표 (starX, 250)
            
            function getBackgroundY(earthY) {
                const slope = (250 - earthY) / (starX - 100);
                return earthY + slope * (750 - 100);
            }

            const bgYa = getBackgroundY(150);
            const bgYb = getBackgroundY(350);

            // 선 업데이트
            lineA.setAttribute('x2', 750);
            lineA.setAttribute('y2', bgYa);
            lineB.setAttribute('x2', 750);
            lineB.setAttribute('y2', bgYb);

            // 배경 상 업데이트
            pointSa.setAttribute('cy', bgYa);
            pointSb.setAttribute('cy', bgYb);
        }

        function setStar(d, name) {
            dSlider.value = d;
            starName.innerText = name;
            updateParallax();
        }

        dSlider.addEventListener('input', () => {
            starName.innerText = "별 S";
            updateParallax();
        });

        // 초기화
        updateParallax();
    </script>
</body>
</html>
